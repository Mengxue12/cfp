# ─────────────────────────────────────────────────────────────
#  My CFP list. Edit this file on github.com (pencil icon) → Commit.
#  The page refreshes itself; no build step.
#
#  Fields
#    name      short name shown on the card            (required)
#    full      full conference name
#    edition   year of the edition the deadlines are for
#    tags      any of: edge, systems, mlsys, arch, perf, hpc, network, workshop
#              (you can invent new tags; filters appear automatically)
#    ccf       CCF rank: A / B / C, or leave empty
#    icore     ICORE (formerly CORE) rank: A* / A / B / C, or leave empty
#    link      CFP / conference page
#    when      conference dates (free text)
#    where     location (free text)
#    status    watching | planning | submitted | skip
#    note      anything you like
#    deadlines list of cycles. Each cycle:
#        label     e.g. "Spring", "Round 1" (optional)
#        abstract  "YYYY-MM-DD HH:MM" (optional)
#        paper     "YYYY-MM-DD HH:MM" (required)
#        notification  "YYYY-MM-DD" (optional)
#        camera_ready  "YYYY-MM-DD" (optional)
#        tz        AoE (default) | UTC | UTC+2 | UTC-7 ...
#
#  Always put dates in quotes.
#  If every deadline of a venue has passed, the page guesses next year's
#  date (same day +1 year) and marks it "est." until you update it.
# ─────────────────────────────────────────────────────────────

